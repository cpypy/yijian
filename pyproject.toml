[project]
name = "yijian"
version = "0.1.0"
description = "译见 · 桌面双语论文阅读器"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Yijian contributors" }]
keywords = ["arxiv", "latex", "translation", "bilingual", "desktop"]
classifiers = [
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.28",
]

[project.optional-dependencies]
ui = ["pywebview>=5.0"]
dev = ["ruff>=0.6", "pytest>=8"]

[project.urls]
Homepage = "https://github.com/cpypy/yijian"
Issues = "https://github.com/cpypy/yijian/issues"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".runtime", ".deps", ".wheels", "data", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
