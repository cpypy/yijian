name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python engine dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller texlate

      - name: Install tectonic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/texlate/tools
          BASE="https://github.com/tectonic-typesetting/tectonic/releases/download/continuous"
          VER="0.17.0%2B20260731"
          case "$RUNNER_OS" in
            Windows) ASSET="tectonic-${VER}-x86_64-pc-windows-msvc.zip" ;;
            macOS)   ASSET="tectonic-${VER}-aarch64-apple-darwin.tar.gz" ;;
            Linux)   ASSET="tectonic-${VER}-x86_64-unknown-linux-gnu.tar.gz" ;;
          esac
          curl -fL --retry 3 -o data/texlate/tools/tectonic.pkg "$BASE/$ASSET"
          python - <<'PY'
          import tarfile, zipfile
          from pathlib import Path
          tools = Path("data/texlate/tools")
          pkg = tools / "tectonic.pkg"
          if pkg.read_bytes()[:2] == b"PK":
              zipfile.ZipFile(pkg).extractall(tools)
          else:
              with tarfile.open(pkg) as tf:
                  tf.extractall(tools)
          pkg.unlink()
          for exe in tools.iterdir():
              print(exe.name, exe.stat().st_size)
              if exe.name.lower().startswith("tectonic"):
                  try:
                      exe.chmod(0o755)
                  except OSError:
                      pass
          PY
          ls -la data/texlate/tools/

      - name: Build sidecar
        shell: bash
        run: |
          python -m PyInstaller sidecar/yijian-engine.spec \
            --noconfirm --distpath dist-sidecar --workpath .build/work-sidecar

      - name: Stage sidecar for bundling
        shell: bash
        run: |
          mkdir -p src-tauri/sidecar
          cp -R dist-sidecar/yijian-engine/. src-tauri/sidecar/
          # macOS/Linux 上资源会丢可执行位，这里补回来
          if [ -f src-tauri/sidecar/yijian-engine ]; then
            chmod +x src-tauri/sidecar/yijian-engine
          fi
          ls -la src-tauri/sidecar | head -20

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        shell: bash
        run: npm install

      - name: Generate icons
        shell: bash
        run: npx tauri icon app-icon.png

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev

      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('译见 {0}', github.ref_name) || '' }}
          releaseDraft: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yijian-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*
